<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%" height="100%" fill="none" role="img" aria-label="Kultra proof of work loop: Detection, Interception, and Notification side-by-side pipeline">
  <defs>
    <!-- Incident Card Glowing Red Border Filter -->
    <filter id="incidentGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#d64545" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Floating Slack Card Deep Elevation Shadow -->
    <filter id="slackElevation" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3" />
    </filter>

    <!-- Laser Glow Filter -->
    <filter id="laserBeamGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Bridge Gradient -->
    <linearGradient id="bridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d64545" />
      <stop offset="50%" stop-color="#f2a93b" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Laser Vertical Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff5a5a" stop-opacity="0" />
      <stop offset="25%" stop-color="#ff4d4d" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="75%" stop-color="#ff4d4d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff5a5a" stop-opacity="0" />
    </linearGradient>

    <!-- Product Thumbnail Clip -->
    <clipPath id="productThumbClip">
      <rect width="84" height="84" rx="4" />
    </clipPath>

    <!-- Laser Clip -->
    <clipPath id="errorBoxClip">
      <rect x="0" y="24" width="472" height="52" rx="3" />
    </clipPath>

    <style>
      .hero-text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .hero-mono {
        font-family: 'Roboto Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      @keyframes scanLaser {
        0% { transform: translateX(16px); }
        48% { transform: translateX(456px); }
        52% { transform: translateX(456px); }
        98% { transform: translateX(16px); }
        100% { transform: translateX(16px); }
      }
      @keyframes streamDash {
        to { stroke-dashoffset: -24; }
      }
      .laser-scanner {
        animation: scanLaser 3.6s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      }
      .telemetry-stream-pulse {
        stroke-dasharray: 6 6;
        animation: streamDash 1.2s linear infinite;
      }
    </style>
  </defs>

  <!-- 1. LEFT ELEMENT: THE STREAMLINED INCIDENT CARD -->
  <g id="incident-card" transform="translate(40, 30)">
    <rect
      x="0"
      y="0"
      width="520"
      height="520"
      rx="4"
      fill="#0e0f11"
      stroke="#d64545"
      stroke-width="1.75"
      filter="url(#incidentGlow)"
    />
    <rect
      x="0"
      y="0"
      width="520"
      height="520"
      rx="4"
      fill="#0e0f11"
      stroke="rgba(255,255,255,0.08)"
      stroke-width="1"
    />

    <!-- Header: Triage Status & Latency Metric -->
    <g transform="translate(24, 22)">
      <rect
        x="0"
        y="0"
        width="172"
        height="26"
        rx="100"
        fill="rgba(214,69,69,0.1)"
        stroke="#d64545"
        stroke-width="1"
      />
      <circle cx="14" cy="13" r="3.5" fill="#d64545" />
      <text
        class="hero-mono"
        x="24"
        y="17"
        fill="#d64545"
        font-size="10.5"
        font-weight="600"
        letter-spacing="0.04em"
      >
        DISAPPROVAL DETECTED
      </text>

      <rect
        x="348"
        y="0"
        width="124"
        height="26"
        rx="100"
        fill="rgba(242,169,59,0.08)"
        stroke="rgba(242,169,59,0.3)"
        stroke-width="1"
      />
      <circle cx="360" cy="13" r="3" fill="#f2a93b" />
      <text
        class="hero-mono"
        x="370"
        y="17"
        fill="#f4f1ea"
        font-size="11"
        font-weight="500"
      >
        Captured in &lt;1s
      </text>
    </g>

    <line x1="24" y1="62" x2="496" y2="62" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

    <!-- Product Identity: Alpine Anorak -->
    <g transform="translate(24, 80)">
      <g clip-path="url(#productThumbClip)">
        <rect width="84" height="84" rx="4" fill="#131418" />
        <image
          href="/assets/alpine-anorak.jpg"
          x="0"
          y="0"
          width="84"
          height="84"
          preserveAspectRatio="xMidYMid slice"
        />
      </g>
      <rect
        width="84"
        height="84"
        rx="4"
        fill="none"
        stroke="rgba(255,255,255,0.12)"
        stroke-width="1"
      />
      <text
        class="hero-mono"
        x="102"
        y="16"
        fill="#6b7078"
        font-size="10.5"
        letter-spacing="0.04em"
      >
        CATALOG SKU: OW-8842-BLK-M
      </text>
      <text
        class="hero-text"
        x="102"
        y="42"
        fill="#f4f1ea"
        font-size="18"
        font-weight="600"
      >
        Alpine Expedition Anorak
      </text>
      <text class="hero-text" x="102" y="64" fill="#b9b3a5" font-size="13">
        Variant: Slate Black / Medium · Price: $148.00 USD
      </text>
      <text class="hero-mono" x="102" y="82" fill="#45484f" font-size="11">
        GMC Offer ID: raw_feed_91024_us
      </text>
    </g>

    <!-- Ad Traffic Exposure Band -->
    <g transform="translate(24, 184)">
      <rect
        x="0"
        y="0"
        width="472"
        height="58"
        rx="3"
        fill="#131418"
        stroke="rgba(255,255,255,0.08)"
        stroke-width="1"
      />
      <g transform="translate(18, 14)">
        <text class="hero-text" x="0" y="12" fill="#6b7078" font-size="11">
          Active Traffic Exposure
        </text>
        <text class="hero-mono" x="0" y="32" fill="#f4f1ea" font-size="15" font-weight="500">
          1,840 clicks at risk
        </text>
      </g>
      <line x1="220" y1="10" x2="220" y2="48" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <g transform="translate(238, 14)">
        <text class="hero-text" x="0" y="12" fill="#6b7078" font-size="11">
          Google Ads Campaign Status
        </text>
        <text class="hero-mono" x="0" y="32" fill="#d64545" font-size="15" font-weight="500">
          Shopping Ads Auction Paused
        </text>
      </g>
    </g>

    <!-- Protocol Error Box & Laser Scanning Interception -->
    <g transform="translate(24, 260)">
      <text class="hero-mono" x="0" y="14" fill="#6b7078" font-size="11" letter-spacing="0.04em">
        INTERCEPTED PROTOCOL ERROR
      </text>
      <text class="hero-mono" x="472" y="14" fill="#d64545" font-size="10.5" text-anchor="end">
        [CRITICAL]
      </text>

      <rect
        x="0"
        y="24"
        width="472"
        height="52"
        rx="3"
        fill="#07080a"
        stroke="rgba(214,69,69,0.35)"
        stroke-width="1"
      />
      <text
        class="hero-mono"
        x="16"
        y="56"
        fill="#f4f1ea"
        font-size="12.5"
        font-weight="500"
      >
        item_disapproved: missing_required_attribute [gtin]
      </text>

      <g clip-path="url(#errorBoxClip)">
        <g class="laser-scanner">
          <rect
            x="-14"
            y="24"
            width="28"
            height="52"
            fill="url(#laserGrad)"
            opacity="0.3"
            filter="url(#laserBeamGlow)"
          />
          <line
            x1="0"
            y1="26"
            x2="0"
            y2="74"
            stroke="#ffffff"
            stroke-width="1.8"
            filter="url(#laserBeamGlow)"
          />
          <circle cx="0" cy="28" r="2.5" fill="#ff4d4d" />
          <circle cx="0" cy="72" r="2.5" fill="#ff4d4d" />
        </g>
      </g>

      <text class="hero-text" x="0" y="96" fill="#b9b3a5" font-size="12">
        Google crawler rejected feed: Missing UPC/GTIN barcode attribute.
      </text>
    </g>

    <!-- Agnostic Action Buttons: [Edit Product] and [GMC Console] -->
    <g transform="translate(24, 432)">
      <g>
        <rect
          x="0"
          y="0"
          width="226"
          height="48"
          rx="3"
          fill="#f2a93b"
          stroke="#f2a93b"
          stroke-width="1"
        />
        <text
          class="hero-text"
          x="113"
          y="29"
          fill="#1a1305"
          font-size="13.5"
          font-weight="600"
          text-anchor="middle"
        >
          Edit Product
        </text>
      </g>

      <g transform="translate(246, 0)">
        <rect
          x="0"
          y="0"
          width="226"
          height="48"
          rx="3"
          fill="#131418"
          stroke="rgba(255,255,255,0.18)"
          stroke-width="1"
        />
        <text
          class="hero-text"
          x="113"
          y="29"
          fill="#f4f1ea"
          font-size="13.5"
          font-weight="600"
          text-anchor="middle"
        >
          GMC Console
        </text>
      </g>
    </g>
  </g>

  <!-- 2. DELIBERATE TELEMETRY CONNECTION BRIDGE -->
  <g id="telemetry-bridge" transform="translate(565, 250)">
    <path
      d="M 0 20 L 105 20"
      stroke="#d64545"
      stroke-width="6"
      stroke-opacity="0.25"
      filter="url(#laserBeamGlow)"
    />
    <path
      d="M 0 20 L 105 20"
      stroke="url(#bridgeGrad)"
      stroke-width="2"
      stroke-opacity="0.75"
    />
    <path
      class="telemetry-stream-pulse"
      d="M 0 20 L 105 20"
      stroke="#ffffff"
      stroke-width="2.5"
      stroke-linecap="round"
    />
    <path
      d="M 98 14 L 108 20 L 98 26"
      fill="none"
      stroke="#f2a93b"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="2" cy="20" r="3.5" fill="#d64545" />

    <!-- Anchored Latency Badge -->
    <rect
      x="-8"
      y="38"
      width="128"
      height="26"
      rx="100"
      fill="#131418"
      stroke="#7a5a26"
      stroke-width="1"
    />
    <text
      class="hero-mono"
      x="56"
      y="55"
      fill="#f2a93b"
      font-size="10.5"
      font-weight="500"
      text-anchor="middle"
    >
      ⚡ Live Dispatch: 0.28s
    </text>
  </g>

  <!-- 3. RIGHT ELEMENT: THE SLACK DISPATCH CARD -->
  <g id="slack-card" transform="translate(680, 50)">
    <rect
      x="0"
      y="0"
      width="480"
      height="480"
      rx="6"
      fill="#ffffff"
      filter="url(#slackElevation)"
    />
    <rect
      x="0"
      y="0"
      width="480"
      height="480"
      rx="6"
      fill="none"
      stroke="rgba(0,0,0,0.08)"
      stroke-width="1"
    />

    <!-- Slack Channel Ribbon -->
    <g transform="translate(24, 20)">
      <text class="hero-text" x="0" y="15" fill="#616061" font-size="14" font-weight="600">
        #
      </text>
      <text class="hero-text" x="14" y="15" fill="#1d1c1d" font-size="13" font-weight="700">
        merchant-alerts
      </text>
      <text class="hero-mono" x="432" y="14" fill="#007a5a" font-size="10.5" font-weight="500" text-anchor="end">
        LIVE DISPATCH · 0.28s
      </text>
    </g>

    <line x1="24" y1="46" x2="456" y2="46" stroke="#f0f0f0" stroke-width="1" />

    <!-- Slack App Identity -->
    <g transform="translate(24, 62)">
      <rect x="0" y="0" width="38" height="38" rx="5" fill="#0e0f11" />
      <g transform="translate(4, 4) scale(0.62)">
        <line x1="20" y1="20" x2="6" y2="10" stroke="#6b7078" stroke-width="2" />
        <line x1="20" y1="20" x2="8" y2="32" stroke="#6b7078" stroke-width="2" />
        <line x1="20" y1="20" x2="33" y2="33" stroke="#6b7078" stroke-width="2" />
        <line x1="20" y1="20" x2="34" y2="9" stroke="#f2a93b" stroke-width="2.5" />
        <circle cx="6" cy="10" r="3.2" fill="#6b7078" />
        <circle cx="8" cy="32" r="3.2" fill="#6b7078" />
        <circle cx="33" cy="33" r="2.8" fill="#6b7078" />
        <circle cx="34" cy="9" r="4.2" fill="#f2a93b" />
        <circle cx="20" cy="20" r="5.5" fill="#f2a93b" />
      </g>
      <text class="hero-text" x="48" y="16" fill="#1d1c1d" font-size="14.5" font-weight="700">
        Kultra Sentinel
      </text>
      <rect x="160" y="5" width="30" height="15" rx="3" fill="#f2f2f2" />
      <text class="hero-text" x="165" y="16" fill="#616061" font-size="9.5" font-weight="700">
        APP
      </text>
      <text class="hero-text" x="200" y="16" fill="#616061" font-size="12">
        12:04 PM
      </text>
    </g>

    <!-- Verbatim Slack Block Notification Box -->
    <g transform="translate(24, 118)">
      <rect x="0" y="0" width="4" height="230" rx="2" fill="#e01e5a" />
      <rect
        x="4"
        y="0"
        width="428"
        height="230"
        rx="0"
        fill="#fafafa"
        stroke="#f0f0f0"
        stroke-width="1"
      />
      <g transform="translate(18, 16)">
        <text class="hero-text" x="0" y="16" fill="#1d1c1d" font-size="15" font-weight="700">
          🚨 Critical Disapproval Detected
        </text>
        <line x1="0" y1="32" x2="392" y2="32" stroke="#ebebeb" stroke-width="1" />

        <g transform="translate(0, 48)">
          <text class="hero-text" x="0" y="14" fill="#1d1c1d" font-size="13" font-weight="700">
            Merchant ID:
          </text>
          <text class="hero-mono" x="98" y="14" fill="#1d1c1d" font-size="13" font-weight="500">
            4918374
          </text>
        </g>

        <g transform="translate(0, 80)">
          <text class="hero-text" x="0" y="14" fill="#1d1c1d" font-size="13" font-weight="700">
            Item:
          </text>
          <text class="hero-text" x="46" y="14" fill="#1d1c1d" font-size="13" font-weight="500">
            ACR-909 (Apex Carbon Runner)
          </text>
        </g>

        <g transform="translate(0, 112)">
          <text class="hero-text" x="0" y="14" fill="#1d1c1d" font-size="13" font-weight="700">
            Error:
          </text>
          <text class="hero-text" x="50" y="14" fill="#e01e5a" font-size="13" font-weight="600">
            Missing GTIN. Ad traffic paused.
          </text>
        </g>

        <g transform="translate(0, 150)">
          <rect x="0" y="0" width="392" height="30" rx="3" fill="#feeef1" stroke="#fad2da" stroke-width="1" />
          <text class="hero-mono" x="12" y="19" fill="#e01e5a" font-size="11" font-weight="500">
            Campaign Impact: 24 active ads suspended
          </text>
        </g>
      </g>
    </g>

    <!-- Footer Action Link: Open Triage Log -->
    <g transform="translate(28, 380)">
      <rect
        x="0"
        y="0"
        width="424"
        height="44"
        rx="4"
        fill="#111214"
        stroke="#111214"
        stroke-width="1"
      />
      <text
        class="hero-text"
        x="212"
        y="27"
        fill="#ffffff"
        font-size="13.5"
        font-weight="600"
        text-anchor="middle"
      >
        Open Triage Log →
      </text>
    </g>

    <text
      class="hero-text"
      x="240"
      y="442"
      fill="#868686"
      font-size="11"
      text-anchor="middle"
    >
      Direct deep link to Google Merchant Center &amp; Shopify fix
    </text>
  </g>
</svg>
