<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" fill="none" role="img" aria-label="Stylized technical illustration of Kultra telemetry console intercepting a Google Merchant disapproval event">
  <defs>
    <!-- Grid pattern for technical background -->
    <pattern id="telemetryGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>
    <!-- Gradients (restrained, no neon glows) -->
    <linearGradient id="panelBgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F1522" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="cardBgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141C2B" />
      <stop offset="100%" stop-color="#0D131F" />
    </linearGradient>
    <linearGradient id="accentBadgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97724" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#D97724" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="streamGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="70%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#D97724" />
    </linearGradient>
    <!-- Embedded Clash Display web font definitions -->
    <style>
      @font-face {
        font-family: 'Clash Display';
        src: url('https://cdn.fontshare.com/wf/5HPV3UJUTRGUMHDLLTJKWGVPFGAKYJX3/FFBQJ5XURUJWMMBB7NX6DBDELXZR7T4I/NULWCMFPHMNO5EOBFBRF7EKVXV5JVMFB.woff2') format('woff2');
        font-weight: 200;
      }
      @font-face {
        font-family: 'Clash Display';
        src: url('https://cdn.fontshare.com/wf/2QNEFGROUS53RDOVAHQH4CNZZUWGOWOY/XHI55XFKRZLKG77T3N3QTH2YVHMLJQ5U/KVT4BC5ZH7LF4OBHM2Q7KOOZRRZZY5ZK.woff2') format('woff2');
        font-weight: 300;
      }
      @font-face {
        font-family: 'Clash Display';
        src: url('https://cdn.fontshare.com/wf/VFMK2COV3DN37JR7JQ4CAOJPZ7KWKNY7/ODD5YJNDLHZZB2MIT3DPVH4EIHAMZ34D/BSY64LPTT3OPLVKAZKL3AHKRWZ3D74AC.woff2') format('woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Clash Display';
        src: url('https://cdn.fontshare.com/wf/2GQIT54GKQY3JRFTSHS4ARTRNRQISSAA/3CIP5EBHRRHE5FVQU3VFROPUERNDSTDF/JTSL5QESUXATU47LCPUNHZQBDDIWDOSW.woff2') format('woff2');
        font-weight: 500;
      }
      @font-face {
        font-family: 'Clash Display';
        src: url('https://cdn.fontshare.com/wf/FPDAZ2S6SW4QMSRIIKNNGTPM6VIXYMKO/5HNPQ453FRLIQWV2FNOBUU3FKTDZQVSG/Z3MGHFHX6DCTLQ55LJYRJ5MDCZPMFZU6.woff2') format('woff2');
        font-weight: 600;
      }
      @font-face {
        font-family: 'Clash Display';
        src: url('https://cdn.fontshare.com/wf/BFBSY7LX5W2U2EROCLVVTQP4VS7S4PC3/IIUX4FGTMD2LK2VWD3RVTAS4SSMUN7B5/53RZKGODFYDW3QHTIL7IPOWTBCSUEZK7.woff2') format('woff2');
        font-weight: 700;
      }
      text {
        font-family: 'Clash Display', -apple-system, sans-serif;
      }
      .mono-protocol-error {
        font-family: 'JetBrains Mono', monospace !important;
      }
    </style>
  </defs>

  <!-- Outer Console Frame with subtle precision stroke -->
  <rect x="2" y="2" width="1196" height="676" rx="6" fill="#0a0b1d" stroke="#1E293B" stroke-width="1.5" />
  <rect x="2" y="2" width="1196" height="676" rx="6" fill="url(#telemetryGrid)" />

  <!-- Console Top Chrome Bar -->
  <path d="M 2 8 C 2 4.7 4.7 2 8 2 L 1192 2 C 1195.3 2 1198 4.7 1198 8 L 1198 52 L 2 52 Z" fill="#0B0F19" stroke="#1E293B" stroke-width="1" />
  
  <!-- System Status Indicators (Steady, no pulse/blink) -->
  <circle cx="32" cy="27" r="4" fill="#1E293B" />
  <circle cx="48" cy="27" r="4" fill="#1E293B" />
  <circle cx="64" cy="27" r="4" fill="#1E293B" />

  <text x="96" y="32" fill="#94A3B8" font-family="Clash Display, -apple-system, sans-serif" font-size="13" font-weight="500">Kultra Telemetry Engine - Real-time stream</text>
  
  <rect x="990" y="16" width="180" height="22" rx="3" fill="#141C2B" stroke="#1E293B" stroke-width="1" />
  <circle cx="1006" cy="27" r="3.5" fill="#10B981" />
  <text x="1018" y="32" fill="#F8FAFC" font-family="Clash Display, -apple-system, sans-serif" font-size="11.5" font-weight="500">Google Pub/Sub Ingest</text>

  <!-- MAIN THREE-COLUMN DASHBOARD ILLUSTRATION -->

  <!-- 1. LEFT PANEL: STREAM INGESTION TELEMETRY (Width: 260) -->
  <g transform="translate(30, 75)">
    <rect width="250" height="570" rx="4" fill="url(#panelBgGrad)" stroke="#1E293B" stroke-width="1" />
    
    <!-- Panel Header -->
    <text x="20" y="32" fill="#F8FAFC" font-family="Clash Display, -apple-system, sans-serif" font-size="14" font-weight="600">Event Stream</text>
    <text x="20" y="50" fill="#94A3B8" font-family="Clash Display, -apple-system, sans-serif" font-size="12">Direct Merchant API v1 push</text>

    <line x1="20" y1="65" x2="230" y2="65" stroke="#1E293B" stroke-width="1" />

    <!-- Telemetry Metric 1 -->
    <text x="20" y="92" fill="#94A3B8" font-family="Clash Display, -apple-system, sans-serif" font-size="11.5">Average Ingest Latency</text>
    <text x="20" y="122" fill="#F8FAFC" font-family="Clash Display, -apple-system, sans-serif" font-size="24" font-weight="700">18.4 ms</text>
    <rect x="130" y="105" width="100" height="6" rx="2" fill="#141C2B" />
    <rect x="130" y="105" width="82" height="6" rx="2" fill="#10B981" />

    <!-- Latency Histogram Illustration -->
    <text x="20" y="162" fill="#94A3B8" font-family="Clash Display, -apple-system, sans-serif" font-size="11.5">Throughput Distribution</text>
    <g transform="translate(20, 180)">
      <!-- Baseline -->
      <line x1="0" y1="90" x2="210" y2="90" stroke="#1E293B" stroke-width="1" />
      <!-- Histogram Bars -->
      <rect x="5" y="65" width="10" height="25" rx="1" fill="#1E293B" />
      <rect x="20" y="45" width="10" height="45" rx="1" fill="#1E293B" />
      <rect x="35" y="30" width="10" height="60" rx="1" fill="#10B981" fill-opacity="0.8" />
      <rect x="50" y="18" width="10" height="72" rx="1" fill="#10B981" />
      <rect x="65" y="24" width="10" height="66" rx="1" fill="#10B981" fill-opacity="0.9" />
      <rect x="80" y="40" width="10" height="50" rx="1" fill="#10B981" fill-opacity="0.7" />
      <rect x="95" y="55" width="10" height="35" rx="1" fill="#1E293B" />
      <rect x="110" y="48" width="10" height="42" rx="1" fill="#1E293B" />
      <rect x="125" y="22" width="10" height="68" rx="1" fill="#10B981" />
      <rect x="140" y="35" width="10" height="55" rx="1" fill="#10B981" fill-opacity="0.85" />
      <rect x="155" y="60" width="10" height="30" rx="1" fill="#1E293B" />
      <rect x="170" y="70" width="10" height="20" rx="1" fill="#1E293B" />
      <rect x="185" y="28" width="10" height="62" rx="1" fill="#D97724" />
      <rect x="200" y="80" width="10" height="10" rx="1" fill="#1E293B" />
    </g>

    <line x1="20" y1="300" x2="230" y2="300" stroke="#1E293B" stroke-width="1" />

    <!-- Event Trace Stack -->
    <text x="20" y="328" fill="#F8FAFC" font-family="Clash Display, -apple-system, sans-serif" font-size="13" font-weight="600">Recent Mutations</text>

    <!-- Trace Item 1 (Approved) -->
    <g transform="translate(20, 345)">
      <circle cx="6" cy="12" r="3.5" fill="#10B981" />
      <text x="18" y="11" fill="#F8FAFC" font-family="Clash Display, -apple-system, sans-serif" font-size="12" font-weight="500">inventory.update</text>
      <text x="18" y="25" fill="#94A3B8" font-family="Clash Display, -apple-system, sans-serif" font-size="11">Sku OW-7102, sync ok</text>
      <text x="165" y="16" fill="#94A3B8" font-family="Clash Display, -apple-system, sans-serif" font-size="10.5">0.8s ago</text>
    </g>

    <!-- Trace Item 2 (Incident Flagged) -->
    <g transform="translate(20, 395)">
      <rect x="-6" y="0" width="222" height="48" rx="3" fill="#D97724" fill-opacity="0.1" stroke="#D97724" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="6" cy="16" r="4" fill="#D97724" />
      <text x="18" y="17" fill="#F8FAFC" font-family="Clash Display, -apple-system, sans-serif" font-size="12" font-weight="600">product.disapproved</text>
      <text x="18" y="32" fill="#D97724" font-family="Clash Display, -apple-system, sans-serif" font-size="11" font-weight="500">Missing required GTIN</text>
      <text x="165" y="24" fill="#D97724" font-family="Clash Display, -apple-system, sans-serif" font-size="10.5" font-weight="600">Live</text>
    </g>

    <!-- Trace Item 3 (Price Sync) -->
    <g transform="translate(20, 460)">
      <circle cx="6" cy="12" r="3.5" fill="#10B981" />
      <text x="18" y="11" fill="#F8FAFC" font-family="Clash Display, -apple-system, sans-serif" font-size="12" font-weight="500">price.sync</text>
      <text x="18" y="25" fill="#94A3B8" font-family="Clash Display, -apple-system, sans-serif" font-size="11">Item AP-3391, 24.00 USD</text>
      <text x="165" y="16" fill="#94A3B8" font-family="Clash Display, -apple-system, sans-serif" font-size="10.5">4.2s ago</text>
    </g>

    <!-- Trace Item 4 (Title Match) -->
    <g transform="translate(20, 510)">
      <circle cx="6" cy="12" r="3.5" fill="#10B981" />
      <text x="18" y="11" fill="#F8FAFC" font-family="Clash Display, -apple-system, sans-serif" font-size="12" font-weight="500">catalog.verified</text>
      <text x="18" y="25" fill="#94A3B8" font-family="Clash Display, -apple-system, sans-serif" font-size="11">Batch 841, zero latency</text>
      <text x="165" y="16" fill="#94A3B8" font-family="Clash Display, -apple-system, sans-serif" font-size="10.5">7.1s ago</text>
    </g>
  </g>

  <!-- 2. CENTER PANEL: THE INCIDENT ALERT CARD (Focal Hero Point, Width: 570) -->
  <g transform="translate(305, 75)">
    <rect width="570" height="570" rx="5" fill="url(#cardBgGrad)" stroke="#1E293B" stroke-width="1.25" />
    
    <!-- Header of Alert Card -->
    <g transform="translate(28, 24)">
      <!-- Amber Incident Badge (Crisp small radius) -->
      <rect width="186" height="28" rx="3" fill="url(#accentBadgeGrad)" stroke="#D97724" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#D97724" />
      <text x="28" y="18.5" fill="#F8FAFC" font-family="Clash Display, -apple-system, sans-serif" font-size="12" font-weight="600">Disapproval Intercepted</text>

      <!-- Timestamp -->
      <text x="400" y="18" fill="#94A3B8" font-family="Clash Display, -apple-system, sans-serif" font-size="12" text-anchor="end">Captured in 0.4s, push event</text>
    </g>

    <line x1="28" y1="68" x2="542" y2="68" stroke="#1E293B" stroke-width="1" />

    <!-- Product Line Item Header -->
    <g transform="translate(28, 88)">
      <!-- Product Visual Thumbnail Graphic -->
      <rect width="84" height="84" rx="4" fill="#0A0E17" stroke="#1E293B" stroke-width="1" />
      <!-- Stylized Coat Icon -->
      <path d="M 28 32 L 36 24 L 48 24 L 56 32 L 68 44 L 60 52 L 54 44 L 54 70 L 30 70 L 30 44 L 24 52 Z" fill="#1E293B" />
      <path d="M 42 24 L 42 70" stroke="#0F1522" stroke-width="1.5" />
      
      <!-- Product Details -->
      <text x="104" y="24" fill="#F8FAFC" font-family="Clash Display, -apple-system, sans-serif" font-size="18" font-weight="700">Alpine Expedition Anorak</text>
      
      <text x="104" y="46" fill="#94A3B8" font-family="Clash Display, -apple-system, sans-serif" font-size="13">
        Variant: Slate Black / Medium
      </text>

      <text x="104" y="68" fill="#94A3B8" font-family="Clash Display, -apple-system, sans-serif" font-size="13">
        Variant id: <tspan fill="#F8FAFC" font-weight="600">OW-8842-BLK-M</tspan>, Catalog price: <tspan fill="#F8FAFC" font-weight="600">$148.00 USD</tspan>
      </text>
    </g>

    <!-- Commercial Impact Box -->
    <g transform="translate(28, 192)">
      <rect width="514" height="66" rx="4" fill="#0A0E17" stroke="#1E293B" stroke-width="1" />
      <g transform="translate(20, 18)">
        <text x="0" y="14" fill="#94A3B8" font-family="Clash Display, -apple-system, sans-serif" font-size="11.5">30-day Google Ads Traffic</text>
        <text x="0" y="36" fill="#F8FAFC" font-family="Clash Display, -apple-system, sans-serif" font-size="17" font-weight="700">1,840 clicks at risk</text>
      </g>
      <line x1="240" y1="12" x2="240" y2="54" stroke="#1E293B" stroke-width="1" />
      <g transform="translate(260, 18)">
        <text x="0" y="14" fill="#94A3B8" font-family="Clash Display, -apple-system, sans-serif" font-size="11.5">Campaign Budget Exposure</text>
        <text x="0" y="36" fill="#D97724" font-family="Clash Display, -apple-system, sans-serif" font-size="17" font-weight="700">$2,428.80 ad spend / mo</text>
      </g>
    </g>

    <!-- Raw Protocol Error Section (Monospace Strictly Reserved Here) -->
    <g transform="translate(28, 280)">
      <text x="0" y="16" fill="#94A3B8" font-family="Clash Display, -apple-system, sans-serif" font-size="12" font-weight="600">Raw Google Merchant Protocol Error</text>
      
      <!-- Error String Container -->
      <rect y="28" width="514" height="42" rx="3" fill="#080C14" stroke="#1E293B" stroke-width="1" />
      <text x="16" y="54" fill="#D97724" font-family="JetBrains Mono, monospace" font-size="13" font-weight="500">
        item_disapproved: missing_required_attribute [gtin]
      </text>
    </g>

    <!-- Plain-English Remediation Explanation -->
    <g transform="translate(28, 370)">
      <text x="0" y="16" fill="#94A3B8" font-family="Clash Display, -apple-system, sans-serif" font-size="12" font-weight="600">Immediate Remediation Guide</text>
      
      <rect y="28" width="514" height="68" rx="4" fill="#0F1626" stroke="#1E293B" stroke-width="1" />
      <text x="16" y="52" fill="#F8FAFC" font-family="Clash Display, -apple-system, sans-serif" font-size="13.5" font-weight="400">
        Google requires a valid UPC or EAN barcode for branded apparel.
      </text>
      <text x="16" y="74" fill="#94A3B8" font-family="Clash Display, -apple-system, sans-serif" font-size="13">
        Add manufacturer barcode in Shopify Inventory variant settings to restore Shopping ads.
      </text>
    </g>

    <!-- Deep-Link Action Trigger (Crisp small corner radius, NOT super rounded) -->
    <g transform="translate(28, 484)">
      <rect width="514" height="52" rx="4" fill="#141C2B" stroke="#1E293B" stroke-width="1.25" />
      
      <!-- Shopify Bag Glyphed Mark -->
      <path d="M 40 26 L 46 18 L 52 26 L 40 26 Z M 38 26 L 54 26 L 52 38 L 40 38 Z" fill="#10B981" />
      
      <text x="68" y="32" fill="#F8FAFC" font-family="Clash Display, -apple-system, sans-serif" font-size="14.5" font-weight="600">
        One-click deep link: Fix in Shopify Admin
      </text>

      <path d="M 480 26 L 488 26 M 484 22 L 488 26 L 484 30" stroke="#F8FAFC" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- 3. RIGHT PANEL: CATALOG HEALTH MATRIX (Width: 260) -->
  <g transform="translate(900, 75)">
    <rect width="270" height="570" rx="4" fill="url(#panelBgGrad)" stroke="#1E293B" stroke-width="1" />
    
    <text x="20" y="32" fill="#F8FAFC" font-family="Clash Display, -apple-system, sans-serif" font-size="14" font-weight="600">Merchant Health</text>
    <text x="20" y="50" fill="#94A3B8" font-family="Clash Display, -apple-system, sans-serif" font-size="12">Store: Patagonia Gear Lab</text>

    <line x1="20" y1="65" x2="250" y2="65" stroke="#1E293B" stroke-width="1" />

    <!-- Metric Card 1 -->
    <rect x="20" y="85" width="230" height="88" rx="4" fill="#0D131F" stroke="#1E293B" stroke-width="1" />
    <text x="36" y="110" fill="#94A3B8" font-family="Clash Display, -apple-system, sans-serif" font-size="11.5">Approved active items</text>
    <text x="36" y="142" fill="#F8FAFC" font-family="Clash Display, -apple-system, sans-serif" font-size="26" font-weight="700">4,192</text>
    <text x="180" y="142" fill="#10B981" font-family="Clash Display, -apple-system, sans-serif" font-size="12" font-weight="600">99.4%</text>

    <!-- Metric Card 2 (Intercepted Item) -->
    <rect x="20" y="188" width="230" height="88" rx="4" fill="#0D131F" stroke="#D97724" stroke-width="1" />
    <text x="36" y="213" fill="#94A3B8" font-family="Clash Display, -apple-system, sans-serif" font-size="11.5">Disapproved / action req.</text>
    <text x="36" y="245" fill="#D97724" font-family="Clash Display, -apple-system, sans-serif" font-size="26" font-weight="700">1 item</text>
    <text x="160" y="245" fill="#D97724" font-family="Clash Display, -apple-system, sans-serif" font-size="12" font-weight="600">Intercepted</text>

    <!-- Metric Card 3 (Budget Salvaged) -->
    <rect x="20" y="291" width="230" height="88" rx="4" fill="#0D131F" stroke="#1E293B" stroke-width="1" />
    <text x="36" y="316" fill="#94A3B8" font-family="Clash Display, -apple-system, sans-serif" font-size="11.5">Wasted Spend Prevented</text>
    <text x="36" y="348" fill="#10B981" font-family="Clash Display, -apple-system, sans-serif" font-size="24" font-weight="700">$18,400</text>
    <text x="182" y="348" fill="#94A3B8" font-family="Clash Display, -apple-system, sans-serif" font-size="11">YTD</text>

    <line x1="20" y1="400" x2="250" y2="400" stroke="#1E293B" stroke-width="1" />

    <!-- Architectural Pipeline Badges -->
    <text x="20" y="426" fill="#F8FAFC" font-family="Clash Display, -apple-system, sans-serif" font-size="13" font-weight="600">Infrastructure Watch</text>

    <g transform="translate(20, 442)">
      <!-- Pipe 1 -->
      <rect y="0" width="230" height="34" rx="3" fill="#141C2B" stroke="#1E293B" stroke-width="1" />
      <circle cx="16" cy="17" r="3.5" fill="#10B981" />
      <text x="30" y="22" fill="#F8FAFC" font-family="Clash Display, -apple-system, sans-serif" font-size="12">Google Cloud Pub/Sub</text>
      <text x="195" y="22" fill="#94A3B8" font-family="Clash Display, -apple-system, sans-serif" font-size="10.5">Active</text>

      <!-- Pipe 2 -->
      <rect y="44" width="230" height="34" rx="3" fill="#141C2B" stroke="#1E293B" stroke-width="1" />
      <circle cx="16" cy="61" r="3.5" fill="#10B981" />
      <text x="30" y="66" fill="#F8FAFC" font-family="Clash Display, -apple-system, sans-serif" font-size="12">Merchant API v1</text>
      <text x="195" y="66" fill="#94A3B8" font-family="Clash Display, -apple-system, sans-serif" font-size="10.5">Synced</text>

      <!-- Pipe 3 -->
      <rect y="88" width="230" height="34" rx="3" fill="#141C2B" stroke="#1E293B" stroke-width="1" />
      <circle cx="16" cy="105" r="3.5" fill="#10B981" />
      <text x="30" y="110" fill="#F8FAFC" font-family="Clash Display, -apple-system, sans-serif" font-size="12">Shopify Admin Webhook</text>
      <text x="195" y="110" fill="#94A3B8" font-family="Clash Display, -apple-system, sans-serif" font-size="10.5">Ready</text>
    </g>
  </g>
</svg>
